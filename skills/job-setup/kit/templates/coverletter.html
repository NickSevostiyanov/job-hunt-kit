<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cover Letter - {{NAME}} - {{COMPANY}} {{ROLE}}</title>
<style>
  @page { size: Letter; margin: 0.55in 0.7in; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 10.5pt; color: #000; background: #fff; }
  .name { font-size: 20pt; font-weight: bold; margin-bottom: 4px; }
  .contact { font-size: 9.5pt; line-height: 1.6; margin-bottom: 12px; }
  hr { border: none; border-top: 1.5px solid #000; margin-bottom: 14px; }
  .date, .recipient { margin-bottom: 10px; line-height: 1.5; }
  .subject { font-weight: bold; margin-bottom: 12px; }
  p { line-height: 1.5; margin-bottom: 10px; }
  .closing { margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="name">{{NAME}}</div>
  <div class="contact">{{LOCATION}} &nbsp;|&nbsp; {{PHONE}} &nbsp;|&nbsp; {{EMAIL}} &nbsp;|&nbsp; {{LINKS}}</div>
  <hr />
  <div class="date">{{DATE_LONG}}</div>
  <div class="recipient">{{RECIPIENT}}<br />{{COMPANY}}<br />{{COMPANY_LOCATION}}</div>
  <div class="subject">Re: {{ROLE}}</div>

  <p>Dear {{SALUTATION}},</p>

  <!-- Opening: the role, and the one line in the posting that you match best. No "I am thrilled". -->
  <p>{{OPENING}}</p>

  <!-- 2-3 body paragraphs. Each pairs one posting requirement with one profile highlight and its evidence. -->
  <p>{{BODY_1}}</p>
  <p>{{BODY_2}}</p>

  <!-- Close: location, work authorization, availability, one link. -->
  <p>{{CLOSE}}</p>

  <div class="closing">Sincerely,<br />{{NAME}}</div>
</body>
</html>
